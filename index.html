<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Object Information</title>

  <style>

    body{
      margin:0;
      padding:20px;
      background:#f2f2f2;
      font-family:Arial, sans-serif;
    }

    .container{
      max-width:700px;
      margin:auto;
    }

    .card{
      background:white;
      border-radius:15px;
      padding:25px;
      box-shadow:0 4px 15px rgba(0,0,0,0.15);
    }

    .image-box{
      text-align:center;
      margin-bottom:20px;
    }

    .image-box img{
      max-width:100%;
      max-height:300px;
      border-radius:12px;
      object-fit:contain;
      border:1px solid #ddd;
      padding:10px;
      background:#fafafa;
    }

    h1{
      margin-top:0;
      color:#222;
      text-align:center;
    }

    .info{
      margin-top:20px;
    }

    .info p{
      font-size:17px;
      line-height:1.6;
      margin:12px 0;
    }

    .label{
      font-weight:bold;
      color:#444;
    }

    .not-found{
      text-align:center;
      font-size:24px;
      color:red;
    }

    .loading{
      text-align:center;
      font-size:22px;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="card" id="content">

    <div class="loading">
      Loading...
    </div>

  </div>

</div>

<script>

const SHEET_API =
"https://opensheet.elk.sh/1Qs3QiinhTlOdH-FT-Jhs6BdYLJ16zegKQK6PMSwF48s/Sheet1";

const params = new URLSearchParams(window.location.search);

const objectID = params.get("id");

fetch(SHEET_API)

.then(response => response.json())

.then(data => {

  console.log(data);

  const obj = data.find(item =>
    item.ObjectID &&
    objectID &&
    item.ObjectID.trim().toUpperCase() ===
    objectID.trim().toUpperCase()
  );

  if(obj){

    document.getElementById("content").innerHTML = `

      <h1>${obj.Name || "Unnamed Object"}</h1>

      <div class="image-box">

        ${
          obj.Image
          ?
          `<img src="${obj.Image}" alt="Object Image">`
          :
          `<p>No Image Available</p>`
        }

      </div>

      <div class="info">

        <p>
          <span class="label">Object ID:</span>
          ${obj.ObjectID || "-"}
        </p>

        <p>
          <span class="label">Name:</span>
          ${obj.Name || "-"}
        </p>

        <p>
          <span class="label">Description:</span><br><br>
          ${obj.Description || "No description available"}
        </p>

      </div>

    `;

  }

  else{

    document.getElementById("content").innerHTML = `

      <div class="not-found">

        Object Not Found

      </div>

    `;

  }

})

.catch(error => {

  console.log(error);

  document.getElementById("content").innerHTML = `

    <div class="not-found">

      Error Loading Data

    </div>

  `;

});

</script>

</body>

</html>
